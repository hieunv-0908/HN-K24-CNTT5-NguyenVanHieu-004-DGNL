name: Java CI with Gradle (Full Pipeline)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    working-directory: ./HN_K24_CNTT5_DGNL_4-5

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        build-root-directory: ./HN_K24_CNTT5_DGNL_4-5

    - name: Make gradlew executable
      run: chmod +x gradlew

    # BƯỚC 1: KIỂM TRA CÚ PHÁP & CODE STYLE
    - name: 1. Check Syntax & Style
      run: ./gradlew check -x test

    # BƯỚC 2: BIÊN DỊCH (BUILD)
    - name: 2. Compile & Build
      run: ./gradlew classes testClasses

    # BƯỚC 3: CHẠY UNIT TEST
    - name: 3. Run Tests
      run: ./gradlew test

    # BƯỚC 4: ĐÓNG GÓI THÀNH FILE JAR / BOOTJAR
    - name: 4. Package Application (JAR)
      run: ./gradlew bootJar -x test

    # BƯỚC PHỤ: LƯU ARTIFACT FILE JAR LÊN GITHUB ACTIONS
    - name: Upload Executable JAR
      uses: actions/upload-artifact@v4
      with:
        name: app-release-jar
        path: HN_K24_CNTT5_DGNL_4-5/build/libs/*.jar
