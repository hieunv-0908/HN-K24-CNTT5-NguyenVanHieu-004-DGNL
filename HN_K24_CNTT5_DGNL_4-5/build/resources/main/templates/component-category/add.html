<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<form th:action="@{/component-category/add}" method="post" th:object="${componentCategory}">

    <label for="name">Name:</label>
    <input type="text" id="name" th:field="*{name}" required><br>

    <label for="description">Description:</label>
    <textarea id="description" th:field="*{description}" required></textarea><br>

    <input type="submit" value="Submit">
</form>
<a href="/component-category/list">Back to List</a>
</body>
</html>
